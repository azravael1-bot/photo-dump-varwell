<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Photo Dump</title>

  <style>
    /* Menggunakan teknik Masonry / Column Layout */
    .galeri {
      /* Membagi tampilan jadi 5 kolom */
      column-count: 5;
      /* Jarak antar kolom */
      column-gap: 15px;
      padding: 15px;
    }

    .galeri img {
      width: 100%;           /* Lebar disesuaikan dengan kolom */
      height: auto;          /* TINGGI ASLI/PROPORSIOANAL (Tanpa Crop!) */
      display: block;
      margin-bottom: 15px;   /* Jarak ke foto di bawahnya */
      border-radius: 8px;    /* Opsional: Sudut melengkung */
    }

    /* Penyesuaian khusus di layar HP */
    @media (max-width: 768px) {
      .galeri {
        column-count: 2;     /* Di HP otomatis berubah jadi 2 kolom */
      }
    }
  </style>
</head>
<body>

  <div class="galeri">
